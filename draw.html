<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>きせかえデザイン</title>

<!-- Supabase SDKの読み込み -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    text-align: center;
    font-family: sans-serif;
    background: #fff5fa;
}

h1 {
    font-size: 24px;
    margin: 8px 0 14px;
}

/* 色ボタン */
.color {
    width: 42px;
    height: 42px;
    margin: 4px;
    border: 2px solid #555;
    border-radius: 8px;
    cursor: pointer;
}

/* 操作ボタン */
button {
    cursor: pointer;
    padding: 9px 14px;
    margin: 4px;
    border: 1px solid #888;
    border-radius: 10px;
    background: white;
    font-size: 16px;
}

/* 描画画面（高さを2200にして頭上スペースを半分に調整） */
#drawingArea {
    position: relative;
    width: min(100%, 512px);
    aspect-ratio: 1024 / 2200;
    margin: 15px auto;
    line-height: 0;
    touch-action: none;
    border: 2px dashed #ffb6c1;
    background-color: #ffffff;
}

/* 人形（目安としての表示） */
#dollImage {
    position: absolute;
    left: 25%;
    top: 7%;
    width: 50%;
    height: 93.8%;
    object-fit: contain;
    pointer-events: none;
}

/* 着色キャンバス */
#canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    mix-blend-mode: multiply;
}

/* 状態表示 */
#status {
    min-height: 1.5em;
    font-size: 14px;
    color: #555;
}
</style>
</head>

<body>

<h1>きせかえデザイン</h1>

<!-- 色選択 -->
<div>
<button class="color" style="background:black" onclick="setColor('black')"></button>
<button class="color" style="background:yellow" onclick="setColor('yellow')"></button>
<button class="color" style="background:blue" onclick="setColor('blue')"></button>
<button class="color" style="background:red" onclick="setColor('red')"></button>
<button class="color" style="background:green" onclick="setColor('green')"></button>
<button class="color" style="background:purple" onclick="setColor('purple')"></button>
<button class="color" style="background:pink" onclick="setColor('pink')"></button>
<button class="color" style="background:orange" onclick="setColor('orange')"></button>
</div>

<br>

<!-- 筆の太さ -->
<div>
<button onclick="setSize(10)">ほそい</button>
<button onclick="setSize(30)">ちゅうくらい</button>
<button onclick="setSize(60)">ふとい</button>
<button onclick="setEraser()">けしゴム</button>
</div>

<!-- 人形と着色キャンバス -->
<div id="drawingArea">
    <img id="dollImage" alt="きせかえにんぎょう">
    <canvas id="canvas" width="1024" height="2200"></canvas>
</div>

<!-- 操作 -->
<div>
<button onclick="clearCanvas()">ぜんぶけす</button>
<button onclick="returnToRoom()">へやにもどる</button>
</div>

<p id="status" aria-live="polite">いろをぬってみよう！</p>

<script>

// Supabaseの初期化（URLとKeyはご自身のものに書き換えてください）
const SUPABASE_URL = 'https://yapohmzbgojtaygfceel.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LzzA7XlGG4Q6qGQDpf8_mA_FZepVODX';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 選択された人形番号を受け取る
const params = new URLSearchParams(location.search);
const dollNumber = params.get("doll") || "1";

// 人形画像
const dollImage = document.getElementById("dollImage");
dollImage.src = "doll/doll" + dollNumber + ".png";

// キャンバス
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const status = document.getElementById("status");

let drawing = false;
let currentColor = "red";
let currentSize = 16;
let erasing = false;
let imageReady = false;

// 人形の読み込み
dollImage.onload = function() {
    imageReady = true;
    status.textContent = "いろをぬってみよう！";
};

dollImage.onerror = function() {
    status.textContent = "にんぎょうがよみこめないよ。";
};

// 色を選ぶ
function setColor(color) {
    currentColor = color;
    erasing = false;
}

// 筆の太さ
function setSize(size) {
    currentSize = size;
}

// 消しゴム
function setEraser() {
    erasing = true;
}

// 描画位置
function getPosition(e) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: (e.clientX - rect.left) * canvas.width / rect.width,
        y: (e.clientY - rect.top) * canvas.height / rect.height
    };
}

// 描き始め
canvas.addEventListener("pointerdown", function(e) {
    if (!imageReady) return;

    drawing = true;
    canvas.setPointerCapture(e.pointerId);

    const p = getPosition(e);

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = currentSize;

    if (erasing) {
        ctx.globalCompositeOperation = "destination-out";
    } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = currentColor;
    }

    ctx.lineTo(p.x + 0.01, p.y + 0.01);
    ctx.stroke();
});

// 描いている途中
canvas.addEventListener("pointermove", function(e) {
    if (!drawing) return;

    const p = getPosition(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
});

// 描き終わり
canvas.addEventListener("pointerup", function() {
    drawing = false;
});

canvas.addEventListener("pointercancel", function() {
    drawing = false;
});

// 全消し
function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    status.textContent = "きれいになったよ！";
}

// ★ここがポイント：マネキンは含めず、描いた服（キャンバス）だけを保存する！
async function saveCurrentState() {
    try {
        if (!imageReady) return;

        // 1. キャンバスの描画内容をDataURL（PNG形式）に変換
        const dataUrl = canvas.toDataURL("image/png");

        // DataURLをBlob（バイナリデータ）に変換する関数
        const res = await fetch(dataUrl);
        const blob = await res.blob();

        // ファイル名を決定（例: art-slot1.png）
        const fileName = `art-slot${dollNumber}.png`;

        // 2. Supabase Storage（dress-images）へアップロード（upsert: true で上書き）
        const { data: storageData, error: storageError } = await supabase.storage
            .from('dress-images')
            .upload(fileName, blob, {
                contentType: 'image/png',
                upsert: true
            });

        if (storageError) throw storageError;

        // 3. ストレージの公開URLを取得
        const { data: publicUrlData } = supabase.storage
            .from('dress-images')
            .getPublicUrl(fileName);

        const imageUrl = publicUrlData.publicUrl;

        // 4. cakeテーブルの slot （1〜5）に合わせて image_path を更新（上書き）
        const { error: dbError } = await supabase
            .from('cake')
            .upsert({
                slot: parseInt(dollNumber),
                image_path: imageUrl,
                created_at: new Date().toISOString()
            }, { onConflict: 'slot' });

        if (dbError) throw dbError;

        console.log("Supabaseへの保存が完了しました！");

    } catch (e) {
        console.error("Supabaseへの保存に失敗しました:", e);
    }
}

// 部屋に戻るボタンから確実に呼ばれる関数
function returnToRoom() {
    saveCurrentState();
    location.href = 'index.html'; // 必ず部屋に戻る
}
</script>
</body>
</html>
