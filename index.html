<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEBきせかえ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

#shop {
    width: 1000px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background-image: url("background/room-background.png");
    background-size: 100% 100%;
    background-position: center;
}

/* 人形を並べる場所 */
.dolls {
    position: absolute;
    left: 5%;
    top: 25%;   /* ★ここを少し下げて床に合わせる */
    width: 90%;
    height: 65%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: end; /* グリッドの下部にピタッと合わせる */
    justify-items: center;
}

/* ★1体分のコンテナ（素体と服を重ねるための枠） */
.doll-container {
    position: relative;
    width: 80%;
    height: 80%;
    cursor: pointer;
}

/* 素体画像と服画像の共通スタイル（完全に重ね合わせる） */
.doll-container img {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

/* 着せ替えボタン */
#drawButton {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 10;
    padding: 10px 16px;
    border: 2px solid white;
    border-radius: 20px;
    background: #e879a9;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="shop">
    <div class="dolls" id="dolls"></div>
    <button id="drawButton" onclick="startDressup()">
        きせかえる
    </button>
</div>

<script>
let selectedDoll = 1;

// 人形5体を読み込む
for (let i = 1; i <= 5; i++) {
    // ★重ね合わせ用のコンテナを作成
    const container = document.createElement("div");
    container.className = "doll-container";

    // 1. 下層：ベースの素体画像
    const baseDoll = document.createElement("img");
    baseDoll.alt = "にんぎょう素体" + i;
    baseDoll.src = "doll/doll" + i + ".png";

    // 2. 上層：保存された服のレイヤー画像
    const clothesLayer = document.createElement("img");
    clothesLayer.alt = "ふく" + i;
    
    const savedClothes = localStorage.getItem("dressed_clothes_" + i);
    if (savedClothes) {
        clothesLayer.src = savedClothes;
    } else {
        // 服がまだない場合は透明な画像（または何も表示しない）
        clothesLayer.style.display = "none";
    }

    // コンテナに素体と服を重ねて追加
    container.appendChild(baseDoll);
    container.appendChild(clothesLayer);

    // クリックしたらその人形を選んでお絵かき画面へ
    container.onclick = function() {
        selectedDoll = i;
        startDressup();
    };

    baseDoll.onerror = function() {
        console.error("素体画像が見つかりません:", baseDoll.src);
    };

    document.getElementById("dolls").appendChild(container);
}

function startDressup() {
    location.href = "draw.html?doll=" + selectedDoll;
}
</script>

</body>
</html>
