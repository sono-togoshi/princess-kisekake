<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<title>WEBきせかえ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

#shop {
    width: 1000px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background-image: url("background/room-background.png");
    background-size: 100% 100%;
    background-position: center;
}

/* 人形を並べる場所 */
.dolls {
    position: absolute;
    left: 5%;
    top: 25%;   
    width: 90%;
    height: 65%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: end; 
    justify-items: center;
}

/* 各人形の個別の高さを微調整する設定 */
.doll-container.doll-1 { transform: translateY(25px); }
.doll-container.doll-2 { transform: translateY(15px); } 
.doll-container.doll-3 { transform: translateY(15px); } 
.doll-container.doll-4 { transform: translateY(25px); } 
.doll-container.doll-5 { transform: translateY(25px); } 

/* 1体分のコンテナ */
.doll-container {
    position: relative;
    width: 80%;
    aspect-ratio: 1024 / 2200;
    height: auto;
    cursor: pointer;
}

/* 素体画像 */
.doll-container img:not(.clothes-layer) {
    position: absolute;
    left: 25%;
    top: 7%;
    width: 50%;
    height: 93.8%;
    object-fit: contain;
    pointer-events: none;
}

/* 服の画像（保存したキャンバス全体） */
.doll-container img.clothes-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
}
/* 着せ替えボタン */
#drawButton {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 10;
    padding: 10px 16px;
    border: 2px solid white;
    border-radius: 20px;
    background: #e879a9;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="shop">
    <div class="dolls" id="dolls"></div>
    <button id="drawButton" onclick="startDressup()">
        きせかえる
    </button>
</div>

<script>
const SUPABASE_URL = 'https://yapohmzbgojtaygfceel.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LzzA7XlGG4Q6qGQDpf8_mA_FZepVODX';

const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let selectedDoll = 1;

async function loadDolls() {

    // Supabaseから最新5枚の服を読み込む
const { data: clothes, error } = await db
    .from("dress")
        .select("slot, image_path")
        .order("slot");

    if (error) {
        console.error("服の読み込みに失敗:", error);
    }

    // 人形5体を表示
    for (let i = 1; i <= 5; i++) {

        const container = document.createElement("div");
        container.className = "doll-container doll-" + i;

        // 素体
        const baseDoll = document.createElement("img");
        baseDoll.alt = "にんぎょうそたい" + i;
        baseDoll.src = "doll/doll" + i + ".png";

        // 服
 const clothesLayer = document.createElement("img");
clothesLayer.alt = "ふく" + i;
clothesLayer.className = "clothes-layer";
        
        const savedClothes = clothes?.find(item => item.slot === i);

  if (savedClothes) {
    clothesLayer.src = savedClothes.image_path;

    clothesLayer.onload = function() {
        console.log("服の画像を読み込みました:", i, clothesLayer.src);
    };

    clothesLayer.onerror = function() {
        console.error("服の画像を読み込めません:", i, clothesLayer.src);
    };
} else {
    clothesLayer.style.display = "none";
    console.log("服の登録がありません:", i);
}

        container.appendChild(baseDoll);
        container.appendChild(clothesLayer);

        container.onclick = function() {
            selectedDoll = i;
            startDressup();
        };

        baseDoll.onerror = function() {
            console.error("素体画像が見つかりません:", baseDoll.src);
        };

        document.getElementById("dolls").appendChild(container);
    }
}

function startDressup() {
    location.href = "draw.html?doll=" + selectedDoll;
}

loadDolls();
</script>

</body>
</html>
